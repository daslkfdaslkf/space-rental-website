<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>毛泽东语录检索站 — 主题匹配 · 原文展示</title>
  <meta name="description" content="输入问题或关键词，系统自动匹配相关主题，展示毛泽东语录原文、出处与时间。" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===== 顶部 Header ===== -->
  <header id="site-header">
    <div class="header-inner">
      <div class="logo-area">
        <span class="logo-star">★</span>
        <span class="logo-title">毛泽东语录检索站</span>
      </div>
      <nav class="header-nav">
        <a href="#search-section">检索语录</a>
        <a href="#categories-section">浏览主题</a>
        <a href="#random-section">随机一条</a>
      </nav>
    </div>
  </header>

  <!-- ===== Hero ===== -->
  <section id="hero-section">
    <div class="hero-inner">
      <p class="hero-badge">原文 · 出处 · 主题匹配</p>
      <h1 class="hero-title">毛泽东语录<br/>主题检索站</h1>
      <p class="hero-subtitle">
        输入你正面对的问题、困惑或关键词<br/>
        系统自动匹配相关主题，展示对应语录原文
      </p>
    </div>
  </section>

  <!-- ===== 搜索区 ===== -->
  <section id="search-section">
    <div class="section-inner">
      <div class="search-card">
        <label class="search-label" for="main-input">输入问题或关键词</label>
        <div class="search-input-wrap">
          <textarea
            id="main-input"
            placeholder="例如：不知道怎么判断这件事 / 团队意见不统一 / 遇到困难想放弃 / 学了但用不上 / 迷茫找不到方向 / 青年人怎么成长……"
            rows="3"
          ></textarea>
        </div>
        <div class="search-actions">
          <button id="search-btn" class="btn-primary" onclick="doSearch()">
            <span>🔍</span> 查找相关语录
          </button>
          <button class="btn-ghost" onclick="clearSearch()">清空</button>
        </div>
        <!-- 示例标签 -->
        <div class="example-tags">
          <span class="example-tag-label">试试：</span>
          <button class="example-tag" onclick="fillAndSearch('遇到困难想放弃')">遇到困难想放弃</button>
          <button class="example-tag" onclick="fillAndSearch('事情太多不知道先做什么')">事情太多不知道先做什么</button>
          <button class="example-tag" onclick="fillAndSearch('团队意见不统一')">团队意见不统一</button>
          <button class="example-tag" onclick="fillAndSearch('学了用不上')">学了用不上</button>
          <button class="example-tag" onclick="fillAndSearch('青年人怎么成长')">青年人怎么成长</button>
          <button class="example-tag" onclick="fillAndSearch('迷茫找不到方向')">迷茫找不到方向</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== 搜索结果区 ===== -->
  <section id="result-section" style="display:none;">
    <div class="section-inner">
      <!-- 用户输入回显 -->
      <div class="result-header">
        <div class="result-query">
          <span class="result-query-label">你输入的是：</span>
          <span id="result-query-text" class="result-query-value"></span>
        </div>
        <div class="result-themes" id="result-themes-wrap">
          <!-- 动态插入匹配到的主题标签 -->
        </div>
      </div>
      <!-- 语录卡片列表 -->
      <div id="result-quotes-list" class="quotes-grid">
        <!-- 动态插入 -->
      </div>
      <div id="result-empty" class="result-empty" style="display:none;">
        <p>暂未找到精确匹配的语录，已为你展示所有推荐主题。</p>
      </div>
    </div>
  </section>

  <!-- ===== 主题分类浏览 ===== -->
  <section id="categories-section">
    <div class="section-inner">
      <h2 class="section-title">按主题浏览</h2>
      <p class="section-desc">点击任意主题，直接查看该主题下的全部语录原文</p>
      <div id="categories-grid" class="categories-grid">
        <!-- 动态渲染 -->
      </div>
    </div>
  </section>

  <!-- ===== 主题语录列表（点击主题后出现） ===== -->
  <section id="category-detail-section" style="display:none;">
    <div class="section-inner">
      <div class="category-detail-header">
        <button class="btn-back" onclick="closeCategoryDetail()">← 返回主题列表</button>
        <h2 id="category-detail-title" class="section-title"></h2>
      </div>
      <div id="category-detail-quotes" class="quotes-grid">
        <!-- 动态插入 -->
      </div>
    </div>
  </section>

  <!-- ===== 随机语录 ===== -->
  <section id="random-section">
    <div class="section-inner">
      <h2 class="section-title">随机语录</h2>
      <p class="section-desc">每次点击，随机呈现一条原文</p>
      <div id="random-card" class="random-card">
        <div id="random-quote-text" class="random-quote-text">点击下方按钮，随机显示一条语录</div>
        <div id="random-quote-meta" class="random-quote-meta"></div>
      </div>
      <div style="text-align:center; margin-top:16px;">
        <button class="btn-primary" onclick="showRandom()">🎲 随机一条</button>
      </div>
    </div>
  </section>

  <!-- ===== 语录弹窗（全文展示） ===== -->
  <div id="quote-modal" class="modal-overlay" style="display:none;" onclick="closeModal(event)">
    <div class="modal-box">
      <button class="modal-close" onclick="closeModalDirect()">✕</button>
      <div class="modal-tag" id="modal-category"></div>
      <blockquote class="modal-quote" id="modal-quote-text"></blockquote>
      <div class="modal-meta">
        <span id="modal-source"></span>
        <span id="modal-date"></span>
      </div>
      <div class="modal-tags" id="modal-tags"></div>
      <button class="btn-copy" id="modal-copy-btn" onclick="copyQuote()">📋 复制原文</button>
    </div>
  </div>

  <!-- ===== Footer ===== -->
  <footer id="site-footer">
    <div class="footer-inner">
      <p>毛泽东语录检索站 · 原文展示资料站</p>
      <p class="footer-sub">语录来源：《毛泽东语录》《毛泽东选集》等公开出版物</p>
    </div>
  </footer>

  <script src="js/quotes-data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
